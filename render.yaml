# Render Blueprint: one click creates the database, the API and the UI.
# https://render.com/docs/blueprint-spec
databases:
  - name: ecsa-db
    plan: free            # free DBs expire after 30 days; upgrade to "basic-256mb" for production
    databaseName: ecsa
    user: ecsa

services:
  - type: web
    name: ecsa-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ECSA_DATABASE_URL
        fromDatabase:
          name: ecsa-db
          property: connectionString

  - type: web
    name: ecsa-ui
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: streamlit run ecsa/ui/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: ECSA_DATABASE_URL
        fromDatabase:
          name: ecsa-db
          property: connectionString
